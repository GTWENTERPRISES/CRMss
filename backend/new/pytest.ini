[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    --verbose
    --strict-markers
    --tb=short
    --cov=apps
    --cov-report=html
    --cov-report=term-missing
    --reuse-db
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    celery: Tests that require Celery
    external: Tests that require external services (OLT, MikroTik, etc)
testpaths = tests
