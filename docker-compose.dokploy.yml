# Backend del CRM para Dokploy: Django (API), middleware de red, Redis y Celery.
#
# El frontend va aparte, en Vercel. Solo `django` se publica (dominio en Dokploy,
# puerto 8000); el middleware lo ve únicamente Django, por la red interna.
#
# Las variables ${...} se cargan en la pestaña Environment de Dokploy (plantilla:
# deploy/dokploy.env.example). La base SQLite, los archivos subidos y los
# respaldos viven en el volumen `datos`: recrear los contenedores no borra nada.

x-backend: &backend
  build:
    context: ./backend/new
  restart: unless-stopped
  volumes:
    - datos:/data
  environment: &entorno
    DJANGO_DEBUG: "False"
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
    FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY}
    # + el nombre interno (el middleware llama a Django por http://django:8000) y
    # crm.2-24-198-215.sslip.io, el dominio de respaldo que no depende del DNS de
    # homelink.net.ec (dominiosecuador no publica api2 de forma estable).
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*},django,localhost,127.0.0.1,crm.2-24-198-215.sslip.io
    CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://cr-mss.vercel.app}
    DJANGO_TIME_ZONE: ${DJANGO_TIME_ZONE:-America/Guayaquil}
    SQLITE_PATH: /data/db.sqlite3
    MEDIA_ROOT_PATH: /data/media
    RESPALDOS_DIR: /data/respaldos
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/1
    MIDDLEWARE_INTERNA_URL: http://middleware:4000
    CLAVE_INTERNA_MW: ${CLAVE_INTERNA_MW}
    DJANGO_SERVICIO_EMAIL: ${DJANGO_SERVICIO_EMAIL:-servicio@middleware.local}
    DJANGO_SERVICIO_CLAVE: ${DJANGO_SERVICIO_CLAVE}
    DJANGO_ADMIN_EMAIL: ${DJANGO_ADMIN_EMAIL}
    DJANGO_ADMIN_CLAVE: ${DJANGO_ADMIN_CLAVE}
    # Correo saliente (recuperar contraseña, avisos). Sin EMAIL_HOST no se envía nada.
    EMAIL_HOST: ${EMAIL_HOST:-}
    EMAIL_PORT: ${EMAIL_PORT:-587}
    EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
    EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
    EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
    DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-}

services:
  django:
    <<: *backend
    command: ["web"]
    expose:
      - "8000"
    depends_on:
      - redis
    healthcheck:
      # Un pedido HTTP de verdad, no solo el puerto: si gunicorn se cuelga, el
      # contenedor queda "unhealthy" en vez de verse sano. Cualquier respuesta
      # (el login contesta 405 a un GET) es que está vivo; sin respuesta, falla.
      test: ["CMD", "python", "-c", "import http.client as h; c = h.HTTPConnection('127.0.0.1', 8000, timeout=10); c.request('GET', '/api/v1/auth/token/'); c.getresponse()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  celery_worker:
    <<: *backend
    command: ["worker"]
    depends_on:
      - redis
      - django

  celery_beat:
    <<: *backend
    command: ["beat"]
    depends_on:
      - redis
      - django

  middleware:
    build:
      # Desde la raíz: importa reglas compartidas de web/src/lib (ver middleware/Dockerfile).
      context: .
      dockerfile: middleware/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "4000"
      DJANGO_API_URL: http://django:8000/api/v1
      DJANGO_SERVICIO_EMAIL: ${DJANGO_SERVICIO_EMAIL:-servicio@middleware.local}
      DJANGO_SERVICIO_CLAVE: ${DJANGO_SERVICIO_CLAVE}
      CLAVE_INTERNA_MW: ${CLAVE_INTERNA_MW}
      CREDENTIALS_KEY: ${CREDENTIALS_KEY}
      CORS_ORIGIN: ${CORS_ALLOWED_ORIGINS:-https://cr-mss.vercel.app}
      TZ: ${DJANGO_TIME_ZONE:-America/Guayaquil}
      # 1 = solo atiende la API, sin automatismos contra los equipos.
      TAREAS_APAGADAS: ${TAREAS_APAGADAS:-}
    expose:
      - "4000"
    depends_on:
      - django

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data

volumes:
  datos:
  redis:
